<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开 EasyReader</title>
<style>body{margin:0;background:#f4f6f5;color:#263c35;font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;display:grid;min-height:100vh;place-items:center}main{max-width:520px;margin:24px;padding:40px;background:white;border:1px solid #e2e9e6;border-radius:22px;box-shadow:0 12px 60px #173b2910}small{letter-spacing:.15em;color:#628077}h1{font-size:26px;font-weight:600}p{color:#64756e}a,button{display:inline-block;padding:10px 18px;border:0;border-radius:10px;background:#246e5b;color:white;text-decoration:none;font:inherit;cursor:pointer}code{color:#246e5b}footer{font-size:12px;margin-top:24px;color:#718079}</style>
<main><small>EASYREADER</small><h1>你的阅读空间</h1><p id="status">正在连接本机阅读服务…</p><p>如果尚未启动，请双击同一文件夹里的 <code>启动软件.vbs</code>。它会在后台准备服务，并自动打开阅读界面。</p><a id="open" hidden>进入阅读器</a> <button onclick="connect()">重新连接</button><footer>HTML 是快捷入口。PDF 翻译与保留版式需要本地服务，无法只靠一个离线网页运行。</footer></main>
<script src=".local-entry.js"></script>
<script>
const status = document.getElementById('status'), link = document.getElementById('open');
async function connect() {
  const url = window.EASYREADER_URL;
  if (!/^http:\/\/127\.0\.0\.1:\d+$/.test(url || '')) { status.textContent = '首次使用，请先双击「启动软件.vbs」。'; return; }
  link.href = url; link.hidden = false; status.textContent = '正在连接本机阅读服务…';
  try { await fetch(url + '/api/health', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(2500) }); location.replace(url); }
  catch { status.textContent = '尚未连接到服务。请先启动软件；若浏览器限制检测，也可点击「进入阅读器」。'; }
}
connect();
</script></html>
